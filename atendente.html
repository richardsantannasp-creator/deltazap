<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atendimento</title>
<link rel="manifest" href="/manifest-atendente.webmanifest"><meta name="theme-color" content="#25d366"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0a2218;--card:#103928;--tx:#f2fbf5;--mut:#9cc3ad;--bd:#1f4d39;--ac:#25d366;--acx:#07241a;--in:#1b5a3a;--out:#14442f;--chat:#0b2519;color-scheme:dark;--wa:#3a3320;--bad:#ff6b6b;--chip:#1a4a35}
@media(prefers-color-scheme:light){:root{--bg:#f0f4f9;--card:#ffffff;--tx:#1c1e21;--mut:#526571;--bd:#e0e6ee;--ac:#25d366;--acx:#07241a;--in:#d8f4cc;--out:#ffffff;--chat:#e8f2e1;color-scheme:light;--wa:#fff4d6;--bad:#d14343;--chip:#e6edf5}}
body{font-family:'WhatsApp Sans Var',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}button:not(.g):not(.d):not(.tab){background-image:none;color:var(--acx);font-weight:600}button.d{color:#fff}.col{border-radius:14px}.col h2{letter-spacing:.08em}a{color:#43cd66}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:var(--acx)}
button.g{background:var(--chip);color:var(--tx)}button.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
.hide{display:none!important}
.av{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;background:var(--c,#667);color:#fff;font:600 13px system-ui}
.av::before{content:attr(data-i)}.av.has::before{content:none}.av img{width:100%;height:100%;object-fit:cover;display:block}.av.sm{width:28px;height:28px;font-size:11px}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;width:100%;max-width:360px;display:grid;gap:12px}
#login h1{margin:0 0 4px;font-size:20px}.note{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:18px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header .sp{flex:1}header b{font-size:15px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);padding:5px 10px;border-radius:99px}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa1ad}.dot.on{background:#22a06b}
main{display:grid;grid-template-columns:300px 1fr 260px;min-height:0}
aside,section{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:var(--card)}
section.chat{background:var(--bg)}aside.info{border-right:0;border-left:1px solid var(--bd);padding:12px;overflow:auto;gap:8px}
.lh{padding:8px 12px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);border-bottom:1px solid var(--bd)}
.list{overflow:auto;flex:1}
.it{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;align-items:center}.it.sel{background:var(--chip)}
.it .t{min-width:0;flex:1}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--ac);color:var(--acx);border-radius:99px;font-size:12px;padding:1px 7px}.bd.q{background:#d97706;color:#fff}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ch .sp{flex:1}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:7px;align-items:flex-end;max-width:88%}.mrow.l{align-self:flex-start}.mrow.s{align-self:flex-end;flex-direction:row-reverse}
.msg{padding:7px 10px;border-radius:10px;border:1px solid var(--bd);white-space:pre-wrap;word-wrap:break-word;background:var(--out)}
.mrow.s .msg{background:var(--in)}.msg time{display:block;font-size:11px;color:var(--mut)}
.sys{align-self:center;background:var(--wa);border-radius:8px;padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--bd)}
.bar textarea{resize:none;height:44px}
.info h3{margin:6px 0 2px;font-size:13px;color:var(--mut);text-transform:uppercase}.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px dashed var(--bd);padding:3px 0}.kv span:first-child{color:var(--mut)}
.tg{font-size:11px;padding:1px 8px;border-radius:99px;margin:3px 4px 0 0;display:inline-block;color:var(--tx);border:1px solid var(--tc,#94a3b8);background:color-mix(in srgb,var(--tc,#94a3b8) 22%,transparent)}.tg.off{opacity:.45;background:transparent}button.tg{cursor:pointer;font:inherit;font-size:11px;font-weight:500;padding:1px 8px}
.lfa{padding:6px 10px;border-bottom:1px solid var(--bd)}.lfa input{padding:6px 8px;font-size:13px}
.empty{margin:auto;color:var(--mut);padding:24px;text-align:center}
.back{display:none}
@media (max-width:900px){main{grid-template-columns:1fr}aside.info{display:none}section.chat,aside.lst{grid-area:1/1}main.inchat aside.lst{display:none}main:not(.inchat) section.chat{display:none}.back{display:inline-block}}
</style>
</head>
<body>
<div id="login">
 <form id="lf" autocomplete="on">
  <h1>Painel do atendente</h1>
  <div class="note">Entre com o usuário e a senha que o administrador criou para você.</div>
  <div><label class="note" for="lg">Usuário</label><input id="lg" autocomplete="username" required></div>
  <div><label class="note" for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <div class="err" id="lerr" role="alert"></div>
  <button id="lbtn">Entrar</button>
</form></div>

<div id="app" class="hide">
 <header>
  <b id="who"></b><span class="st"><span class="dot" id="dot"></span><span id="stx"></span></span>
  <span class="sp"></span>
  <span class="note" id="qn"></span>
  <button class="g" id="pushb">Ativar avisos</button><button class="g" id="avail"></button><button class="g" id="out">Sair</button>
 </header>
 <main id="mn">
  <aside class="lst"><div class="lfa"><input id="lq" placeholder="Buscar nome ou telefone"></div><div class="lh">Na fila <span id="cq"></span></div><div class="list" id="ql" style="flex:none;max-height:38%"></div>
   <div class="lh">Meus atendimentos <span id="cm"></span></div><div class="list" id="ml"></div></aside>
  <section class="chat">
   <div class="ch" id="chh"><button class="g back" id="bk">←</button><span id="cav"></span><b id="cnm">Selecione uma conversa</b><span class="sp"></span>
    <button id="claim" class="hide">Assumir</button><button class="g hide" id="files">Arquivos</button>
    <select id="tr" class="hide" style="width:auto"></select><button class="g hide" id="rel" title="A IA volta a responder o lead">Devolver à IA</button>
    <select id="oc" class="hide" style="width:auto"><option value="">Resultado…</option><option value="ganho">Ganho</option><option value="perdido">Perdido</option><option value="cotacao_enviada">Cotação enviada</option></select></div>
   <div id="msgs"><div class="empty">Escolha uma conversa na lista. Conversas na fila podem ser lidas antes de assumir.</div></div>
   <div class="bar hide" id="bar"><select id="qr" style="width:auto;max-width:160px" title="Respostas rápidas"><option value="">Respostas rápidas…</option></select><textarea id="mi" placeholder="Escreva sua mensagem… (Enter envia, Shift+Enter quebra a linha)"></textarea><button id="snd">Enviar</button></div>
  </section>
  <aside class="info" id="inf"></aside>
 </main>
</div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let TK=null;try{TK=localStorage.getItem("atok")}catch(e){}
let ME=null,TEAM=[],LEADS=[],cur=null,lastSig="",prevUnread={},prevQ=-1,AC=null;
async function api(p,body,method){const r=await fetch(p,{method:method||(body?"POST":"GET"),headers:{"X-Token":TK||"","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 if(r.status==401&&TK){bye();throw new Error("sessão")}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||"Erro");return j}
function bye(){TK=null;try{localStorage.removeItem("atok")}catch(e){}ME=null;$("app").classList.add("hide");$("login").classList.remove("hide")}
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.stop(AC.currentTime+.18)}catch(e){}}
// fotos do WhatsApp (iniciais quando não há)
const AV={};
const ini=n=>{const p=String(n||"?").replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/).filter(Boolean);return((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()};
const col=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360} 38% 42%)`};
function av(who,name,sz){const u=AV[who];if(u===undefined&&who){AV[who]=null;fetch("/api/agent/avatar/"+encodeURIComponent(who),{headers:{"X-Token":TK}}).then(async r=>{AV[who]=r.ok?URL.createObjectURL(await r.blob()):false;lastSig="";render()}).catch(()=>{AV[who]=false})}
 return`<span class="av ${sz||""} ${u?"has":""}" data-i="${esc(ini(name))}" style="--c:${col(name||who)}" aria-hidden="true">${u?`<img alt="" src="${u}">`:""}</span>`}

$("lf").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="";$("lbtn").disabled=true;
 try{const r=await fetch("/api/agent/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:$("lg").value,password:$("pw").value})});const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||"Não foi possível entrar");TK=j.token;try{localStorage.setItem("atok",TK)}catch(e){}$("pw").value="";start()}
 catch(x){$("lerr").textContent=x.message}finally{$("lbtn").disabled=false}};
$("out").onclick=async()=>{await pushDrop();try{await api("/api/agent/logout",{})}catch(e){}bye()};
$("avail").onclick=async()=>{await api("/api/agent/status",{available:!ME.available},"PUT");await poll(true)};

async function start(){$("login").classList.add("hide");$("app").classList.remove("hide");loadQuick();await poll(true);setInterval(()=>poll(),3000);setInterval(ping,20000)}
async function ping(){try{const m=await api("/api/agent/me");ME=m.agent;TEAM=m.team;HRS=m.hours;ST=m.stats7;head(m.queue)}catch(e){}}
function head(q){$("who").textContent=ME.name;$("dot").classList.toggle("on",ME.online);
 $("stx").textContent=ME.available?"Disponível":"Ausente (não recebe novas conversas)";$("avail").textContent=ME.available?"Ficar ausente":"Ficar disponível";
 const fmt=s=>s==null?"—":s<90?s+" s":s<5400?Math.round(s/60)+" min":(s/3600).toFixed(1)+" h";
 $("qn").textContent=(q??0)+" na fila"+(HRS&&HRS.enabled?(HRS.open_now?" · dentro do expediente":" · fora do expediente"+(HRS.next_open?" (abre "+HRS.next_open+")":"")):"")+(ST?` · 7 dias: ${ST.handled} atendida(s), 1ª resposta ${fmt(ST.first_reply_s)}`:"")}
async function poll(force){
 try{const [l,m]=await Promise.all([api("/api/agent/leads"),api("/api/agent/me")]);ME=m.agent;TEAM=m.team;HRS=m.hours;ST=m.stats7;LEADS=l.leads;TAGS=l.tags||[];head(m.queue);
  const mine=LEADS.filter(x=>x.agent_id==ME.id),q=LEADS.filter(x=>x.agent_id==null);
  if(prevQ>=0&&q.length>prevQ)beep();prevQ=q.length;
  mine.forEach(x=>{if((prevUnread[x.phone]??0)<x.unread&&x.phone!=cur)beep();prevUnread[x.phone]=x.unread});
  const tot=mine.reduce((a,x)=>a+(x.unread||0),0)+q.length;document.title=(tot?`(${tot}) `:"")+"Atendimento";
  const sig=JSON.stringify([LEADS.map(x=>[x.phone,x.agent_id,x.unread,x.last_ts,x.tags]),cur,ME.available,TEAM.map(t=>t.id+t.online)]);
  if(force||sig!=lastSig){lastSig=sig;render()}
  if(cur)await loadChat()}catch(e){}}
let HRS=null,ST=null,QUICK=[];
function item(x){const unread=x.unread?`<span class="bd ${x.agent_id==null?"q":""}">${x.unread}</span>`:"";
 return`<div class="it ${x.phone==cur?"sel":""}" data-p="${x.phone}">${av(x.phone,x.name||x.phone)}<div class="t"><b>${esc(x.name||x.phone)}</b><small>${esc((x.last_text||"").slice(0,70))}</small>${tagChips(x.tags)}</div>${unread}</div>`}
function render(){const fq=($('lq').value||'').toLowerCase().trim(),vis=x=>!fq||[x.name,x.phone,x.company].some(v=>String(v||'').toLowerCase().includes(fq));const mine=LEADS.filter(x=>x.agent_id==ME.id&&vis(x)),q=LEADS.filter(x=>x.agent_id==null&&vis(x));
 $("cq").textContent=q.length?`(${q.length})`:"";$("cm").textContent=mine.length?`(${mine.length})`:"";
 $("ql").innerHTML=q.map(item).join("")||'<div class="note" style="padding:10px 12px">Ninguém esperando.</div>';
 $("ml").innerHTML=mine.map(item).join("")||'<div class="note" style="padding:10px 12px">Nenhuma conversa com você.</div>';
 document.querySelectorAll(".it").forEach(e=>e.onclick=()=>{cur=e.dataset.p;lastSig="";$("mn").classList.add("inchat");render();loadChat(true)});
 const L=LEADS.find(x=>x.phone==cur);const isMine=L&&L.agent_id==ME.id,inQ=L&&L.agent_id==null;
 $("chh").classList.toggle("hide",false);$("cnm").textContent=L?(L.name||L.phone):"Selecione uma conversa";$("cav").innerHTML=L?av(L.phone,L.name||L.phone):"";
 $("claim").classList.toggle("hide",!inQ);$("files").classList.toggle("hide",!L);$("tr").classList.toggle("hide",!isMine);$("rel").classList.toggle("hide",!isMine);$("oc").classList.toggle("hide",!isMine);$("bar").classList.toggle("hide",!isMine);
 if(isMine){$("tr").innerHTML='<option value="">Transferir…</option><option value="fila">Para a fila</option>'+TEAM.filter(t=>t.id!=ME.id).map(t=>`<option value="${t.id}">${esc(t.name)}${t.online?"":" (ausente)"}</option>`).join("");$("oc").value=L.outcome||""}
 info(L)}
function info(L){if(!L){$("inf").innerHTML="";return}let b={};try{b=JSON.parse(L.bant||"{}")}catch(e){}
 const rows=[["Nicho",L.niche||"—"],["Telefone",L.phone],["Estágio",L.stage],...Object.entries(b).map(([k,v])=>[k.replace(/_/g," "),typeof v=="object"?JSON.stringify(v):v]),["Reunião",L.meeting||"—"]];
 $("inf").innerHTML=`<h3>Etiquetas</h3><div id="tgs"></div><h3>Motivo da transferência</h3><div>${esc(L.handoff_reason||"—")}</div><h3>Dados do lead</h3>`+rows.map(([a,v])=>`<div class="kv"><span>${esc(a)}</span><span>${esc(v)}</span></div>`).join("")+`<h3>Notas internas</h3><div class="note">Só a equipe vê. Nunca vão para o lead.</div><div id="nl"></div><textarea id="nt" rows="3" placeholder="Anotar algo sobre este lead…"></textarea><button class="g" id="nadd">Salvar nota</button>`;
 renderLeadTags(L);$("nt").value=window._nd&&window._ndp==L.phone?window._nd:"";$("nt").oninput=()=>{window._nd=$("nt").value;window._ndp=L.phone};
 $("nadd").onclick=async()=>{const t=$("nt").value.trim();if(!t)return;try{await api("/api/agent/notes/"+L.phone,{text:t});$("nt").value="";window._nd="";loadNotes(L.phone)}catch(e){alert(e.message)}};loadNotes(L.phone)}
async function loadNotes(p){try{const n=await api("/api/agent/notes/"+p);if(p!=cur||!$("nl"))return;$("nl").innerHTML=n.map(x=>`<div class="kv" style="display:block"><b>${esc(x.author)}</b> <small class="note">${new Date(x.ts*1e3).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</small><br>${esc(x.text)}</div>`).join("")||'<div class="note">Nenhuma nota.</div>'}catch(e){}}
async function loadQuick(){try{QUICK=await api("/api/agent/quick");$("qr").innerHTML='<option value="">Respostas rápidas…</option>'+QUICK.map((q,i)=>`<option value="${i}">${esc(q.title)}</option>`).join("");$("qr").classList.toggle("hide",!QUICK.length)}catch(e){}}
$("qr").onchange=()=>{const q=QUICK[+$("qr").value];$("qr").value="";if(!q)return;const L=LEADS.find(x=>x.phone==cur)||{};const first=((L.name||"").trim().split(/\s+/)[0])||"";
 const t=q.body.replace(/\{nome\}/g,first).replace(/\{atendente\}/g,ME.name);const m=$("mi");m.value=(m.value?m.value+" ":"")+t;m.focus()}
async function loadChat(scroll){if(!cur)return;const L=LEADS.find(x=>x.phone==cur);if(!L){cur=null;return}
 const m=await api("/api/agent/messages/"+cur);const sig=JSON.stringify(m);if(sig==window._ms&&!scroll)return;window._ms=sig;
 $("msgs").innerHTML=m.map(x=>{const lead=x.role=="lead",who=lead?(L.name||L.phone):(x.role=="humano"?(x.agent||"Atendente"):"Assistente virtual (IA)");
  return`<div class="mrow ${lead?"l":"s"}">${lead?av(L.phone,L.name||L.phone,"sm"):`<span class="av sm" data-i="${esc(x.role=="humano"?ini(x.agent||"A"):"IA")}" style="--c:${col(who)}" aria-hidden="true"></span>`}<div class="msg"><small class="note">${esc(who)}</small><br>${esc(x.text)}<time>${new Date(x.ts*1e3).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</time></div></div>`}).join("");
 $("msgs").scrollTop=1e9}
$("lq").oninput=()=>{lastSig="";render()};
$("claim").onclick=async()=>{try{await api("/api/agent/claim/"+cur,{});await poll(true)}catch(e){alert(e.message);await poll(true)}};
async function send(){const t=$("mi").value.trim();if(!t||!cur)return;$("mi").value="";try{await api("/api/agent/send/"+cur,{text:t});window._ms="";await poll(true)}catch(e){alert(e.message);$("mi").value=t}}
$("snd").onclick=send;$("mi").onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("rel").onclick=async()=>{if(!confirm("Devolver esta conversa para a IA? Ela volta a responder o lead."))return;await api("/api/agent/release/"+cur,{});cur=null;$("msgs").innerHTML='<div class="empty">Conversa devolvida à IA.</div>';await poll(true)};
$("tr").onchange=async()=>{const v=$("tr").value;if(!v)return;try{await api("/api/agent/transfer/"+cur,{to:v});cur=null;$("msgs").innerHTML='<div class="empty">Conversa transferida.</div>';await poll(true)}catch(e){alert(e.message);$("tr").value=""}};
$("oc").onchange=async()=>{const v=$("oc").value;try{await api("/api/agent/outcome/"+cur,{outcome:v,reason:""});await poll(true)}catch(e){alert(e.message)}};
$("bk").onclick=()=>{$("mn").classList.remove("inchat")};
$("files").onclick=async()=>{try{const fs=await api("/api/agent/files/"+cur);if(!fs.length){alert("Este lead não enviou arquivos.");return}
 const n=prompt("Arquivos recebidos (digite o número para abrir):\n"+fs.map((f,i)=>`${i+1}. ${f.name}`).join("\n"),"1");const f=fs[(parseInt(n)||0)-1];if(!f)return;
 const r=await fetch(`/api/agent/file/${cur}/${encodeURIComponent(f.name)}`,{headers:{"X-Token":TK}});if(!r.ok)throw new Error("Não foi possível abrir");window.open(URL.createObjectURL(await r.blob()),"_blank")}catch(e){alert(e.message)}};
// etiquetas
let TAGS=[];const TCOL={verde:"#25d366",azul:"#3b82f6",amarelo:"#eab308",laranja:"#f97316",vermelho:"#ef4444",roxo:"#8b5cf6",rosa:"#ec4899",cinza:"#94a3b8"};
const tagOf=id=>TAGS.find(t=>t.id==id);
function tagChips(ids){return (ids||[]).map(tagOf).filter(Boolean).map(t=>`<span class="tg" style="--tc:${TCOL[t.color]||"#94a3b8"}">${esc(t.name)}</span>`).join("")}
function renderLeadTags(L){const box=$("tgs");if(!box)return;if(!TAGS.length){box.innerHTML='<div class="note">Nenhuma etiqueta cadastrada.</div>';return}
 box.innerHTML=TAGS.map(t=>`<button type="button" class="tg ${(L.tags||[]).includes(t.id)?"":"off"}" style="--tc:${TCOL[t.color]||"#94a3b8"}" data-t="${t.id}">${esc(t.name)}</button>`).join("");
 box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{const id=+b.dataset.t,st=new Set(L.tags||[]);st.has(id)?st.delete(id):st.add(id);try{const r=await api("/api/agent/leads/"+L.phone+"/tags",{tags:[...st]},"PUT");L.tags=r.tags;renderLeadTags(L);lastSig="";render()}catch(e){alert(e.message)}})}
// app no celular: instalar na tela inicial e receber avisos
const PFX="/api/agent";let SWR=null;
function b2u(s){const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function swInit(){try{if("serviceWorker" in navigator)SWR=await navigator.serviceWorker.register("/sw.js")}catch(e){}pushUi()}
async function pushUi(){const b=$("pushb");if(!b)return;
 if(!SWR||!("PushManager" in window)||!("Notification" in window)){b.dataset.s="na";b.textContent="Avisos no celular";return}
 try{const s=await SWR.pushManager.getSubscription(),on=!!s&&Notification.permission=="granted";b.dataset.s=on?"on":"off";b.textContent=on?"Avisos ativados":"Ativar avisos";
  if(on&&TK)api(PFX+"/push",s.toJSON()).catch(()=>{})}catch(e){}}
async function pushDrop(){try{const s=SWR&&await SWR.pushManager.getSubscription();if(s)await api(PFX+"/push",{endpoint:s.endpoint},"DELETE")}catch(e){}}
$("pushb").onclick=async()=>{const b=$("pushb");
 if(b.dataset.s=="na"){alert("Para receber avisos no celular: no Android, abra no Chrome e use \"Instalar app\" (ou \"Adicionar à tela inicial\"). No iPhone, abra no Safari, toque em Compartilhar > \"Adicionar à Tela de Início\" e abra o app instalado. Depois toque aqui de novo.");return}
 try{if(b.dataset.s=="on"){const s=await SWR.pushManager.getSubscription();if(s){await pushDrop();await s.unsubscribe()}}
  else{const p=await Notification.requestPermission();if(p!="granted"){alert("As notificações estão bloqueadas. Libere nas configurações do navegador para este site.");return}
   const k=(await (await fetch("/api/push/key")).json()).key;const s=await SWR.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b2u(k)});await api(PFX+"/push",s.toJSON())}
 }catch(e){alert("Não foi possível alterar os avisos: "+e.message)}pushUi()};
swInit();
if(TK){start().catch(()=>bye())}
</script>
</body>
</html>
